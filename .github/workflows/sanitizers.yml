name: Sanitizers

on:
  push:
  pull_request:

env:
  DEBIAN_FRONTEND: noninteractive

jobs:
  asan:
    name: AddressSanitizer
    runs-on: ubuntu-latest
    env:
      CC: clang
      CXX: clang++
      ASAN_OPTIONS: >-
        detect_leaks=1:halt_on_error=1:unmap_shadow_on_exit=1:allocator_may_return_null=1:suppressions=${{ github.workspace }}/libvmaf/test/sanitizers/asan.supp
      LSAN_OPTIONS: >-
        suppressions=${{ github.workspace }}/libvmaf/test/sanitizers/lsan.supp
    steps:
      - name: Setup python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install meson
          sudo apt-get update
          sudo -E apt-get -yq install ninja-build clang nasm

      - uses: actions/checkout@v6

      - name: Configure
        run: |
          meson setup libvmaf libvmaf/build_asan \
            --buildtype=debugoptimized \
            -Denable_float=true \
            -Db_sanitize=address \
            -Db_lundef=false

      - name: Build
        run: ninja -vC libvmaf/build_asan

      - name: Test
        run: |
          meson test -C libvmaf/build_asan \
            --timeout-multiplier 10 \
            --print-errorlogs \
            --no-suite known_issues

  ubsan:
    name: UndefinedBehaviorSanitizer
    runs-on: ubuntu-latest
    env:
      CC: clang
      CXX: clang++
      UBSAN_OPTIONS: >-
        halt_on_error=1:abort_on_error=1:print_stacktrace=1:print_summary=1:suppressions=${{ github.workspace }}/libvmaf/test/sanitizers/ubsan.supp
    steps:
      - name: Setup python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install meson
          sudo apt-get update
          sudo -E apt-get -yq install ninja-build clang nasm

      - uses: actions/checkout@v6

      - name: Configure
        run: |
          meson setup libvmaf libvmaf/build_ubsan \
            --buildtype=debugoptimized \
            -Denable_float=true \
            -Db_sanitize=undefined \
            -Db_lundef=false \
            -Dc_args="-fno-sanitize-recover=all -fsanitize-ignorelist=${{ github.workspace }}/libvmaf/test/sanitizers/ubsan.ignorelist" \
            -Dcpp_args="-fno-sanitize-recover=all -fsanitize-ignorelist=${{ github.workspace }}/libvmaf/test/sanitizers/ubsan.ignorelist"

      - name: Build
        run: ninja -vC libvmaf/build_ubsan

      - name: Test
        run: |
          meson test -C libvmaf/build_ubsan \
            --timeout-multiplier 10 \
            --print-errorlogs \
            --no-suite known_issues

  msan:
    name: MemorySanitizer
    runs-on: ubuntu-latest
    env:
      CC: clang
      CXX: clang++
      MSAN_OPTIONS: >-
        halt_on_error=1:print_stats=1:track_origins=2
    steps:
      - name: Setup python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install meson
          sudo apt-get update
          sudo -E apt-get -yq install ninja-build clang

      - uses: actions/checkout@v6

      - name: Configure
        run: |
          meson setup libvmaf libvmaf/build_msan \
            --buildtype=debugoptimized \
            -Denable_float=true \
            -Denable_asm=false \
            -Db_sanitize=memory \
            -Db_lundef=false \
            -Dc_args="-fsanitize-ignorelist=${{ github.workspace }}/libvmaf/test/sanitizers/msan.ignorelist" \
            -Dcpp_args="-fsanitize-ignorelist=${{ github.workspace }}/libvmaf/test/sanitizers/msan.ignorelist"

      - name: Build
        run: ninja -vC libvmaf/build_msan

      - name: Test
        run: |
          # Run MSan tests, allowing test_format_y4m to fail:
          # the Y4M parser uses uninstrumented file I/O which causes
          # allocation-size-too-big false positives under MSan.
          meson test -C libvmaf/build_msan \
            --timeout-multiplier 10 \
            --print-errorlogs \
            --no-suite known_issues \
            --no-suite msan_skip \
            --no-rebuild

  tsan:
    name: ThreadSanitizer
    runs-on: ubuntu-latest
    env:
      CC: clang
      CXX: clang++
      TSAN_OPTIONS: >-
        halt_on_error=1:second_deadlock_stack=1:history_size=4:allocator_may_return_null=1:suppressions=${{ github.workspace }}/libvmaf/test/sanitizers/tsan.supp
    steps:
      - name: Setup python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install meson
          sudo apt-get update
          sudo -E apt-get -yq install ninja-build clang nasm

      - uses: actions/checkout@v6

      - name: Configure
        run: |
          meson setup libvmaf libvmaf/build_tsan \
            --buildtype=debugoptimized \
            -Denable_float=true \
            -Db_sanitize=thread \
            -Db_lundef=false

      - name: Build
        run: ninja -vC libvmaf/build_tsan

      - name: Test
        run: |
          meson test -C libvmaf/build_tsan \
            --timeout-multiplier 10 \
            --print-errorlogs \
            --no-suite known_issues \
            --no-suite stress
